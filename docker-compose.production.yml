name: upnsmoke

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - internal

  backend:
    build:
      context: ./medusa-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 9000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      STORE_CORS: ${STORE_CORS}
      ADMIN_CORS: ${ADMIN_CORS}
      AUTH_CORS: ${AUTH_CORS}
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL}
      STORE_TIMEZONE: America/New_York
      PICKUP_LOCATION_NAME: ${PICKUP_LOCATION_NAME:-Manchester Counter}
      PICKUP_QR_TTL_DAYS: ${PICKUP_QR_TTL_DAYS:-30}
      REQUIRE_ID_FOR_ALL_PICKUPS: ${REQUIRE_ID_FOR_ALL_PICKUPS:-true}
      # Medusa's own database connection loader (pg-connection-loader) retries
      # a failed initial connection 5 times at a 1s interval by default. That
      # is not always enough headroom if Postgres is still finishing startup
      # or briefly busy when this container starts, and a failed connection
      # crashes the process rather than backing off further. Widen the
      # window so a slow-starting or momentarily busy database doesn't flap
      # the container through restart loops.
      __MEDUSA_DB_CONNECTION_MAX_RETRIES: ${MEDUSA_DB_CONNECTION_MAX_RETRIES:-20}
      __MEDUSA_DB_CONNECTION_RETRY_DELAY: ${MEDUSA_DB_CONNECTION_RETRY_DELAY:-2000}
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - medusa_uploads:/server/static
    networks:
      - internal

  storefront:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MEDUSA_BACKEND_URL: http://backend:9000
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: /medusa
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:?NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY must be set — the storefront cannot reach the Store API without it}
        NEXT_PUBLIC_SITE_URL: https://upnsmokevapors.com
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      MEDUSA_BACKEND_URL: http://backend:9000
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: /medusa
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:?NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY must be set — the storefront cannot reach the Store API without it}
      NEXT_PUBLIC_SITE_URL: https://upnsmokevapors.com
      AUTH_SECRET: ${AUTH_SECRET}
      EMPLOYEE_ADMIN_EMAILS: ${EMPLOYEE_ADMIN_EMAILS:-}
      EMPLOYEE_MANAGER_EMAILS: ${EMPLOYEE_MANAGER_EMAILS:-}
      EMPLOYEE_STAFF_EMAILS: ${EMPLOYEE_STAFF_EMAILS:-}
      STORE_TIMEZONE: America/New_York
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  medusa_uploads:

networks:
  internal:
    driver: bridge

